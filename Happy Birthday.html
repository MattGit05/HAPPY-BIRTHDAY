<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday</title>
<style>
:root{--bg:#fbe9ef;--ink:#5a2a3c;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a1a24;--ink:#ffd9e6}}
:root[data-theme="dark"]{--bg:#2a1a24;--ink:#ffd9e6}
html,body{height:100%;margin:0;background:var(--bg);font-family:"Trebuchet MS",Verdana,sans-serif}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:12px;box-sizing:border-box}
canvas{width:100%;max-width:960px;aspect-ratio:16/9;border-radius:18px;background:#ffe6ee}
button,label.btn{font:inherit;font-weight:700;padding:10px 22px;border:0;border-radius:999px;background:#ff6f91;color:#fff;cursor:pointer;display:inline-block}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
label.btn input{position:absolute;opacity:0;width:1px;height:1px}
label.btn:focus-within{outline:3px solid var(--ink);outline-offset:2px}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
</style>
</head>
<body>
<canvas id="c" width="960" height="540" aria-label="Animated birthday cake with balloons and confetti"></canvas>
<div class="row"><label class="btn">Add celebrant photo<input id="f" type="file" accept="image/*"></label><button id="b">Replay</button></div>
<script>
const cv=document.getElementById('c'),x=cv.getContext('2d'),W=960,H=540;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const cols=['#ff6f91','#ffc75f','#6fd6c4','#9b8cff','#ff9671','#f9f871'];
let seed=7;const r=()=>(seed=(seed*16807)%2147483647)/2147483647;
const balloons=[...Array(10)].map((_,i)=>({x:i<5?60+i*45:W-60-(i-5)*45,d:r()*1.6,s:60+r()*50,c:cols[i%6],sw:r()*6}));
const conf=[...Array(90)].map(()=>({x:r()*W,y:r()*-H,v:60+r()*90,w:r()*6,c:cols[Math.floor(r()*6)],rot:r()*6}));
const ease=t=>t<0?0:t>1?1:1-Math.pow(1-t,3);
const bounce=t=>{if(t<=0)return 0;if(t>=1)return 1;return 1-Math.pow(1-t,3)*Math.cos(t*Math.PI*3.2)};
function rr(a,b,w,h,rad){x.beginPath();x.roundRect(a,b,w,h,rad)}
function cake(cx,cy,s,t){
 x.save();x.translate(cx,cy);x.scale(s,s);
 x.fillStyle='#c98f6a';rr(-210,150,420,18,9);x.fill(); // table
 x.fillStyle='#5b3425';rr(-130,40,260,110,18);x.fill();
 x.fillStyle='#7b4632';rr(-130,40,260,24,12);x.fill();
 x.fillStyle='#ff8fab';rr(-95,-30,190,75,16);x.fill();
 x.fillStyle='#fff';x.beginPath();x.moveTo(-95,-14);
 for(let i=0;i<=8;i++){x.quadraticCurveTo(-95+i*23.75-12,6+(i%2)*14,-95+(i+1)*23.75*1,-14)}
 x.lineTo(95,-30);x.lineTo(-95,-30);x.fill();
 for(let i=0;i<5;i++){x.fillStyle=cols[i];x.beginPath();x.arc(-60+i*30,-40,9,0,7);x.fill()}
 for(let i=-1;i<=1;i++){
  const px=i*45;x.fillStyle=cols[(i+3)%6];rr(px-5,-95,10,48,4);x.fill();
  const f=1+Math.sin(t*14+i*2)*.12;
  x.fillStyle='#ffb703';x.beginPath();x.ellipse(px,-110,8*f,16*f,0,0,7);x.fill();
  x.fillStyle='#fff3b0';x.beginPath();x.ellipse(px,-107,3.5,8*f,0,0,7);x.fill();
 }
 x.restore();
}
function balloon(b,t){
 const k=ease((t-b.d)/4.5);if(k<=0)return;
 const y=H+90-k*(H+60),px=b.x+Math.sin(t*1.6+b.sw)*10;
 x.strokeStyle='rgba(90,42,60,.35)';x.lineWidth=2;x.beginPath();x.moveTo(px,y+b.s*.8);
 x.quadraticCurveTo(px+10,y+b.s*1.4,px,y+b.s*2);x.stroke();
 x.fillStyle=b.c;x.beginPath();x.ellipse(px,y,b.s*.5,b.s*.62,0,0,7);x.fill();
 x.fillStyle='rgba(255,255,255,.5)';x.beginPath();x.ellipse(px-b.s*.17,y-b.s*.22,b.s*.1,b.s*.17,.5,0,7);x.fill();
}
function sparkle(px,py,s,a){x.save();x.globalAlpha=a;x.fillStyle='#fff6b0';x.translate(px,py);
 x.beginPath();for(let i=0;i<8;i++){const L=i%2?s*.3:s;x.lineTo(Math.cos(i*Math.PI/4)*L,Math.sin(i*Math.PI/4)*L)}x.fill();x.restore()}
function frame(t){
 const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#ffe6ee');g.addColorStop(1,'#ffd3c4');
 x.fillStyle=g;x.fillRect(0,0,W,H);
 x.fillStyle='rgba(255,255,255,.55)';x.fillRect(0,H-70,W,70); // floor
 // party-room bunting
 for(let i=0;i<12;i++){x.fillStyle=cols[i%6];x.beginPath();x.moveTo(i*88,0);x.lineTo(i*88+44,48+Math.sin(i)*6);x.lineTo(i*88+88,0);x.fill()}
 balloons.forEach(b=>balloon(b,t));
 const push=ease((t-3)/3); // camera push-in 3-6s
 const s=.62+push*.62, cy=250+push*10;
 cake(W/2,cy-push*40,s,t);
 if(t>3)for(let i=0;i<14;i++){const a=t*1.8+i*.9,rad=150+Math.sin(t*2+i)*40;
  sparkle(W/2+Math.cos(a)*rad*1.3,cy-20+Math.sin(a)*rad*.5,10+Math.sin(t*5+i)*5,.5+.5*Math.sin(t*6+i))}
 // title 6-9s
 const tk=bounce((t-6)/1.2);
 if(tk>0){x.save();x.translate(W/2,95);x.scale(tk,tk);x.font='900 84px "Trebuchet MS",Verdana,sans-serif';
  x.textAlign='center';x.textBaseline='middle';x.lineJoin='round';
  x.lineWidth=18;x.strokeStyle='#b5385f';x.strokeText('HAPPY BIRTHDAY',0,6);
  x.lineWidth=14;x.strokeStyle='#ff6f91';x.strokeText('HAPPY BIRTHDAY',0,0);
  x.fillStyle='#fff';x.fillText('HAPPY BIRTHDAY',0,0);x.restore()}
 // celebrant name
 const nk=bounce((t-7)/1.1);
 if(nk>0){x.save();x.translate(W/2,495);x.scale(nk,nk);x.font='900 52px "Trebuchet MS",Verdana,sans-serif';x.textAlign='center';x.textBaseline='middle';
  const w=x.measureText('Rence Muñoz').width+70;
  x.fillStyle='#b5385f';x.beginPath();x.roundRect(-w/2,-38,w,76,38);x.fill();
  x.lineWidth=4;x.strokeStyle='#ff6f91';x.stroke();
  x.fillStyle='#fff';x.fillText('Rence Muñoz',0,3);x.restore()}
 // celebrant photo
 const pk=bounce((t-6.4)/1.1);
 if(photo&&pk>0){const R=82;x.save();x.translate(135,340);x.rotate(-.08);x.scale(pk,pk);
  x.fillStyle='#fff';x.beginPath();x.arc(0,0,R+12,0,7);x.fill();
  x.strokeStyle='#ff6f91';x.lineWidth=6;x.stroke();
  x.beginPath();x.arc(0,0,R,0,7);x.clip();
  const m=Math.min(photo.width,photo.height),sx=(photo.width-m)/2,sy=(photo.height-m)/2;
  x.drawImage(photo,sx,sy,m,m,-R,-R,R*2,R*2);x.restore()}
 // confetti
 const cs=t<6?Math.max(0,(t-1)/2):1,burst=t>6&&t<7.5?(7.5-t)*2.5:0;
 conf.forEach((p,i)=>{const yy=((p.y+t*p.v*(1+burst*.5)*cs)%(H+40));
  if(cs===0)return;x.save();x.translate(p.x+Math.sin(t+i)*14,yy);x.rotate(p.rot+t*2);
  x.fillStyle=p.c;x.fillRect(-p.w,-p.w/2,p.w*2,p.w);x.restore()});
}
let t0=null,raf;
function loop(n){if(t0===null)t0=n;let t=(n-t0)/1000;if(t>10)t=10;frame(t);if(t<10)raf=requestAnimationFrame(loop)}
function play(){cancelAnimationFrame(raf);t0=null;if(reduce){frame(10)}else raf=requestAnimationFrame(loop)}
let photo=null;
f.onchange=e=>{const file=e.target.files[0];if(!file)return;const im=new Image();im.onload=()=>{photo=im;play()};im.src=URL.createObjectURL(file)};
b.onclick=play;play();
</script>
</body>
</html>
